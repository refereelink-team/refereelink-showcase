name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - run: npm run build
  backend-software:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-ci.txt -e '.[test]' ruff
      - run: ruff check server tests --select E4,E7,E9,F
      - run: python -m pytest -q -m 'not cuda'
      - name: Verify extracted source provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          root = Path('backend_core')
          manifest = json.loads((root / 'source-manifest.json').read_text())
          entries = manifest['python_files']
          for name, entry in entries.items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert actual == entry['extracted_sha256'], f'Provenance mismatch: {name}'
          print(f'Verified {len(entries)} extracted Python files')
          PY
