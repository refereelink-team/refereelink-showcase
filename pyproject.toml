[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refereelink-showcase"
version = "0.1.0"
description = "A focused presentation workspace for RefereeLink on a remote CUDA host"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2,<3", "pyserial>=3.5,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
markers = ["cuda: requires a real remote CUDA GPU and compatible PyTorch"]

[tool.ruff]
target-version = "py312"
line-length = 100
